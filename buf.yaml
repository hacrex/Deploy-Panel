version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Connect is one bidirectional stream carrying many message types, so its
    # request and response are named AgentMessage and ControlMessage.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
